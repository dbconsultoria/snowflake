name: myspark-dl pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # toda segunda-feira, 06:00 UTC (03:00 BRT)

# Nunca duas execuções em paralelo sobre o mesmo banco.
concurrency:
  group: myspark-dl-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
  SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

jobs:
  bronze:
    name: Bronze (TiDB -> Snowflake)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      batch_id: ${{ steps.run.outputs.batch_id }}
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: DDL
        run: python -m etl.main --step ddl
      - name: Extract + load
        id: run
        run: python -m etl.main --step bronze

  silver:
    name: Silver
    needs: bronze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m etl.main --step silver --batch-id "${{ needs.bronze.outputs.batch_id }}"

  gold:
    name: Gold
    needs: [bronze, silver]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m etl.main --step gold --batch-id "${{ needs.bronze.outputs.batch_id }}"

  quality-tests:
    name: Quality tests
    needs: [bronze, gold]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m etl.main --step tests --batch-id "${{ needs.bronze.outputs.batch_id }}"
